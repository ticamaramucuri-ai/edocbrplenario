<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 268 68" width="268" height="68">

  <!-- ── Escudo (versão clara para fundos escuros) ── -->
  <g transform="translate(1, 3)">
    <!-- Forma principal -->
    <path d="M27 1 L51 8.5 L51 33 Q51 52 27 62 Q3 52 3 33 L3 8.5 Z"
          fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.45)" stroke-width="1.5"/>
    <!-- Banda superior -->
    <path d="M27 1 L51 8.5 L51 16 L3 16 L3 8.5 Z"
          fill="rgba(255,255,255,0.18)"/>
    <!-- Página do documento -->
    <rect x="12" y="18" width="19" height="24" rx="2.5"
          fill="rgba(255,255,255,0.9)"/>
    <!-- Dobra do canto -->
    <path d="M27.5 18 L31 22 L27.5 22 Z"
          fill="rgba(0,0,0,0.15)"/>
    <!-- Linhas do documento -->
    <line x1="15" y1="25" x2="28" y2="25"
          stroke="#1D3C6E" stroke-width="1.3" opacity="0.45"/>
    <line x1="15" y1="30" x2="28" y2="30"
          stroke="#1D3C6E" stroke-width="1.3" opacity="0.45"/>
    <line x1="15" y1="35" x2="23" y2="35"
          stroke="#1D3C6E" stroke-width="1.3" opacity="0.45"/>
    <!-- Pill vermelho -->
    <rect x="15" y="37" width="19" height="5" rx="2.5"
          fill="#FF6B75" opacity="0.9"/>
  </g>

  <!-- ── Divisor ── -->
  <line x1="64" y1="13" x2="64" y2="56"
        stroke="rgba(255,255,255,0.25)" stroke-width="1"/>

  <!-- ── e-doc (branco) ── -->
  <text x="74" y="40"
        font-family="'Segoe UI','Inter',system-ui,Arial,sans-serif"
        font-size="27" font-weight="700" fill="#ffffff"
        letter-spacing="-0.5">e-doc</text>

  <!-- ── BR (vermelho claro) ── -->
  <text x="149" y="40"
        font-family="'Segoe UI','Inter',system-ui,Arial,sans-serif"
        font-size="27" font-weight="700" fill="#FF7A82"
        letter-spacing="-0.5">BR</text>

  <!-- ── Subtítulo ── -->
  <text x="74" y="56"
        font-family="'Segoe UI','Inter',system-ui,Arial,sans-serif"
        font-size="8.5" fill="rgba(255,255,255,0.5)" letter-spacing="2.2">GESTÃO DE DOCUMENTOS</text>
</svg>
