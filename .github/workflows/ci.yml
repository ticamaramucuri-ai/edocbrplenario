name: CI

on:
  push:
  pull_request:

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun install --cwd mini-services/realtime --frozen-lockfile
      - run: bun run db:generate
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test:security
      - run: bun run test:unit
      - run: DATABASE_URL=file:/tmp/edocbr-unit.db bun test tests/pending-checkin.test.ts
      - run: bun run test:clean:test-tenants
      - run: bun run test:bootstrap:empty-tenant
      - run: bun run test:seed:demo-logins
      - run: bun run test:images:parliamentarian
      - run: python3 tests/test-backup-bundle.py
      - run: python3 -m unittest tests/test_asset_audit.py
      - run: python3 -I tests/test-prune-local-backups.py
      - run: python3 -I tests/test-staging-remote-check.py
      - run: python3 tests/test-staging-gateway-config.py
      - run: python3 tests/test-staging-fault-matrix.py
      - run: python3 scripts/recovery-drill-local.py
      - run: bash scripts/test-party-emblems.sh
      - run: bun run test:session:preparation
      - run: bun run test:session:journey
      - run: bun run test:plenary:official-increments
      - run: bun run test:official:closure
      - run: bun run test:pilot:preflight
      - run: bun run test:mail:delivery
      - run: bun run test:session:readiness
      - run: bun run test:session:capacity
      - run: bun run test:tenant:health-portability
      - run: bun run test:voting:policy
      - run: bun run test:deliberative:roster
      - run: bun run test:deliberation:independent
      - run: bun run test:voting:impediments
      - run: bun run test:voting:report-basis
      - run: bun run test:voting:flow-guards
      - run: bun run test:voting:annulment-integrity
      - run: bun run test:media:domain
      - run: bun run test:media:integration
      - run: bun run test:media:public-link
      - run: bun run test:media:archive
      - run: bun run build
      - run: bun run test:recovery:image-http
      - run: bun run test:recovery:acervo-http
      - run: bunx playwright install chromium
      - run: bun run test:a11y:plenario

  postgres-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client sqlite3
      - run: bun install --frozen-lockfile
      - run: bun run test:postgres:foundation

  media-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Download verified MediaMTX v1.21.2
        run: |
          curl -fLsS -o mediamtx_v1.21.2_linux_amd64.tar.gz https://github.com/bluenviron/mediamtx/releases/download/v1.21.2/mediamtx_v1.21.2_linux_amd64.tar.gz
          curl -fLsS -o checksums.sha256 https://github.com/bluenviron/mediamtx/releases/download/v1.21.2/checksums.sha256
          grep 'mediamtx_v1.21.2_linux_amd64.tar.gz' checksums.sha256 | sha256sum -c
          tar xzf mediamtx_v1.21.2_linux_amd64.tar.gz mediamtx
      - run: MEDIAMTX_BIN="$PWD/mediamtx" bash scripts/media-smoke.sh
