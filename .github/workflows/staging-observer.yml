name: Staging public observer

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: staging-public-observer
  cancel-in-progress: true

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Check public HTTPS and database readiness
        run: |
          python3 - <<'PY'
          import json
          import urllib.request

          base = "https://edocbrplenario.com.br"

          def get(url):
              request = urllib.request.Request(url, headers={"User-Agent": "edocbr-staging-observer/1.0"})
              with urllib.request.urlopen(request, timeout=20) as response:
                  return response.status, response.url, response.headers, response.read()

          status, final_url, headers, _ = get(base + "/")
          if status != 200 or final_url != base + "/":
              raise SystemExit(f"Homepage check failed: status={status}, final_url={final_url}")
          robots = headers.get("X-Robots-Tag", "").lower()
          if "noindex" not in robots:
              raise SystemExit("Staging guard missing: X-Robots-Tag does not contain noindex")

          status, _, _, body = get(base + "/api/v1/health?ready=1")
          health = json.loads(body)
          if status != 200 or health.get("ok") is not True or health.get("database") != "ready":
              raise SystemExit(f"Readiness check failed: status={status}, health={health}")
          version = health.get("version", "")
          if len(version) != 40 or any(char not in "0123456789abcdef" for char in version):
              raise SystemExit(f"Unexpected deployed version: {version!r}")
          with open(__import__('os').environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"version={version}\n")

          status, final_url, _, _ = get("https://www.edocbrplenario.com.br/")
          if status != 200 or final_url != base + "/":
              raise SystemExit(f"www redirect check failed: status={status}, final_url={final_url}")

          print(json.dumps({
              "observedAt": __import__("datetime").datetime.now(__import__("datetime").timezone.utc).isoformat(),
              "homepage": "healthy",
              "readiness": "ready",
              "database": health["database"],
              "deployedVersion": version,
              "robotsGuard": "noindex",
              "wwwRedirect": "apex",
              "observer": "GitHub-hosted runner",
          }, sort_keys=True))
          PY
        id: public
      - name: Check authenticated internal services through the app
        env:
          EDOCBR_PLATFORM_EMAIL: stage-platform-observer@example.invalid
          EDOCBR_PLATFORM_PASSWORD: ${{ secrets.STAGING_MONITOR_PASSWORD }}
          EXPECTED_VERSION: ${{ steps.public.outputs.version }}
        run: |
          test -n "$EDOCBR_PLATFORM_PASSWORD" || { echo 'Missing STAGING_MONITOR_PASSWORD secret'; exit 2; }
          python3 scripts/staging-remote-check.py \
            --base-url https://edocbrplenario.com.br \
            --expect-services app,realtime,webhooks,scheduler \
            --expected-version "$EXPECTED_VERSION"
