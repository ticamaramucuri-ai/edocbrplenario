name: edocbr-plenario-staging

# Toda porta publicada liga em ${STAGE_BIND:-127.0.0.1}. O padrão é loopback: nada
# responde fora da máquina. Em host dedicado, defina STAGE_BIND para expor APENAS a
# porta do app por um proxy — banco, Redis e serviços internos continuam em loopback
# por decisão, não por acidente. Ver deploy/staging/README.md.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: edocbr_stage
      POSTGRES_USER: edocbr_stage
      POSTGRES_PASSWORD: ${STAGE_DB_PASSWORD:?Configure STAGE_DB_PASSWORD no arquivo privado .env}
    ports:
      - "${STAGE_BIND:-127.0.0.1}:${STAGE_DB_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edocbr_stage -d edocbr_stage"]
      interval: 5s
      timeout: 3s
      retries: 12

  app:
    image: edocbr-plenario-staging:local
    build:
      context: ../..
      dockerfile: deploy/staging/Dockerfile
      args:
        NEXT_PUBLIC_REALTIME_URL: http://127.0.0.1:${STAGE_REALTIME_PORT:-3103}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://edocbr_stage:${STAGE_DB_PASSWORD}@postgres:5432/edocbr_stage
      PORT: 3000
      DEFAULT_TENANT_SLUG: staging-example
      REALTIME_AUTH_SECRET: ${STAGE_REALTIME_SECRET:?}
      REALTIME_HEALTH_URL: http://realtime:3003/health
      WEBHOOKS_HEALTH_URL: http://webhooks:3004/health
      SCHEDULER_BASE_URL: http://scheduler:3005
      PARLIAMENTARIAN_IMAGES_ROOT: /data/images
      MEDIA_RECORDINGS_ROOT: /data/recordings
      MEDIA_REPLAY_ROOT: /data/replay
    ports:
      - "${STAGE_BIND:-127.0.0.1}:${STAGE_APP_PORT:-3100}:3000"
    volumes:
      - parliamentarian_images:/data/images
      - media_recordings:/data/recordings
      - media_replay:/data/replay
    command: ["sh", "-c", "chmod 700 /data/recordings /data/replay && exec bun .next/standalone/server.js"]
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/api/v1/bootstrap').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  realtime:
    image: edocbr-plenario-staging:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://edocbr_stage:${STAGE_DB_PASSWORD}@postgres:5432/edocbr_stage
      REALTIME_DATABASE_PROVIDER: postgresql
      REALTIME_AUTH_SECRET: ${STAGE_REALTIME_SECRET:?}
      REALTIME_REDIS_URL: redis://redis:6379
    ports:
      - "${STAGE_BIND:-127.0.0.1}:${STAGE_REALTIME_PORT:-3103}:3003"
    command: ["bun", "mini-services/realtime/index.ts"]
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6

  realtime_peer:
    image: edocbr-plenario-staging:local
    profiles: [fanout-lab]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://edocbr_stage:${STAGE_DB_PASSWORD}@postgres:5432/edocbr_stage
      REALTIME_DATABASE_PROVIDER: postgresql
      REALTIME_AUTH_SECRET: ${STAGE_REALTIME_SECRET:?}
      REALTIME_REDIS_URL: redis://redis:6379
    ports:
      - "${STAGE_BIND:-127.0.0.1}:${STAGE_REALTIME_PEER_PORT:-3104}:3003"
    command: ["bun", "mini-services/realtime/index.ts"]
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6

  webhooks:
    image: edocbr-plenario-staging:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://edocbr_stage:${STAGE_DB_PASSWORD}@postgres:5432/edocbr_stage
      WEBHOOKS_DATABASE_PROVIDER: postgresql
    command: ["bun", "mini-services/webhooks/index.ts"]
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3004/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6

  scheduler:
    image: edocbr-plenario-staging:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      realtime:
        condition: service_started
      webhooks:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://edocbr_stage:${STAGE_DB_PASSWORD}@postgres:5432/edocbr_stage
      REALTIME_HEALTH_URL: http://realtime:3003/health
      WEBHOOKS_HEALTH_URL: http://webhooks:3004/health
    command: ["bun", "mini-services/scheduler/postgres.ts"]
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3005/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6

  # Laboratório opt-in: somente endereços de exemplo, sem relay externo.
  mailpit:
    image: axllent/mailpit@sha256:94f6b70c1436defae6799d9ac7ff0eeff9540465b842026d5cdb018f1c0234ea
    profiles: [mail-lab]
    environment:
      MP_SMTP_TLS_CERT: /certs/mailpit.crt
      MP_SMTP_TLS_KEY: /certs/mailpit.key
      MP_SMTP_REQUIRE_STARTTLS: "true"
      MP_SMTP_ALLOWED_RECIPIENTS: "@example\\.invalid$"
      MP_MAX_MESSAGES: "100"
      MP_DATABASE: /data/mailpit.db
    volumes:
      - ./mail-lab/certs:/certs:ro
      - mailpit_data:/data
    ports:
      - "${STAGE_BIND:-127.0.0.1}:${STAGE_MAILPIT_PORT:-3125}:8025"

  mail_worker:
    image: edocbr-plenario-staging:local
    profiles: [mail-lab]
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://edocbr_stage:${STAGE_DB_PASSWORD}@postgres:5432/edocbr_stage
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM: laboratorio@edocbr.invalid
      SMTP_TLS_CA_FILE: /certs/mailpit.crt
      PUBLIC_BASE_URL: http://127.0.0.1:${STAGE_APP_PORT:-3100}
      MAIL_WORKER_HEALTH_HOST: 0.0.0.0
    volumes:
      - ./mail-lab/certs:/certs:ro
    command: ["bun", "scripts/mail-worker.ts"]
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3006/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  postgres_data:
  parliamentarian_images:
  media_recordings:
  media_replay:
  mailpit_data:
